name: tejara_store
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  karma_design_system_mobile:
    git:
      url: https://github.com/karma-solutions-org/karma_design_system_mobile
      ref: v1.5.3
  auto_route: ^10.2.0
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  flutter_hooks: ^0.21.3+1
  get_it: ^8.3.0
  google_sign_in: ^6.0.0
  cupertino_icons: ^1.0.8
  sign_in_with_apple: ^6.0.0
  responsive_framework: ^1.5.1
  scrollable: ^1.0.5
  flutter_svg: ^2.2.3
  flutter_localizations:
    sdk: flutter
  firebase_app_check: ^0.4.1+4
  shared_preferences: ^2.5.4
  lottie: ^3.3.2
  smooth_page_indicator: ^2.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.2.5
  build_runner: ^2.7.1
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  faker: ^2.2.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/on_boarding_images/
    - assets/icons/
    - assets/videos/
    - assets/logos/

  fonts:
    - family: 'Poppins'
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
        
       

