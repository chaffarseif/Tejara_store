<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradé subtil pour un effet premium -->
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#37a6bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e8ca3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond blanc arrondi (Forme d'application standard) -->
  <rect width="512" height="512" rx="100" fill="#FFFFFF"/>

  <!-- Groupe centré -->
  <g transform="translate(136, 116)">
      
    <!-- La barre verticale du T (Le Pilier) -->
    <!-- Forme solide et stable -->
    <path d="M60 0 H140 V280 C140 302, 122 320, 100 320 H100 C78 320, 60 302, 60 280 V0 Z" 
          fill="url(#tealGradient)"/>

    <!-- La barre horizontale gauche du T -->
    <path d="M0 0 H140 V80 H0 V0 Z" 
          fill="url(#tealGradient)"/>

    <!-- L'accent Jaune (Le "Shop" / La valeur) -->
    <!-- Un cercle parfait détaché pour créer du dynamisme -->
    <circle cx="200" cy="40" r="40" fill="#FFE24B"/>
    
    <!-- Petit détail graphique : Un point bleu sous le jaune pour l'équilibre -->
    <!-- Suggère l'échange de données ou de biens -->
    <circle cx="200" cy="130" r="15" fill="#37a6bf" opacity="0.4"/>

  </g>
</svg>